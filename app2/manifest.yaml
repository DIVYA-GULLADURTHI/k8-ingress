apiVersion: apps/v1 
kind: Deployment
metadata: 
   name: app2
   # deployment set labels 
   labels: 
      purpose: ingress
      project: roboshop 
      app: app2
spec: 
  replicas: 2
  # these are the labels replica set use to create pod replicas, thi should match pod labels 
  selector:
    matchLabels: 
      purpose: ingress 
      project: roboshop 
      app: app2
  # this is pod definition 
  template:        
    metadata: 
       labels: 
         purpose: ingress
         project: roboshop 
         app: app2
    spec:
      containers: 
      - name: app2
        image: chinnaammu/app2:v1  
--- 
apiVersion: v1 
kind: Service 
metadata: 
   name: app2
   labels: 
    purpose: ingress 
    project: roboshop
spec: 
  selector: 
    purpose: ingress 
    project: roboshop
    app: app2
  ports: 
    - protocol: TCP 
      port: 80  # service port
      targetPort: 80 # container port 
--- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:485067906741:certificate/56206148-3a67-411c-a94b-db5ab705a9bf
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: joindevops
spec:
  ingressClassName: alb
  rules:
  - host: "app2.thulasi.fun"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend: 
          service:
            name: app2
            port:
              number: 80 # app1 service port 